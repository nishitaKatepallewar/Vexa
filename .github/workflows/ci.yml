name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # bpy wheels on PyPI are tied to one Python version per Blender release.
          - blender: "4.2.0"
            python: "3.11"
          - blender: "5.2.3"
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Blender as a Python module
        run: pip install "bpy==${{ matrix.blender }}"
      - name: Run tests
        run: python tests/run_all.py
